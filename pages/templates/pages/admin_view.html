<!DOCTYPE html>
<html>
<head>
    <title>Menu Admin</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
        .btn { padding: 5px 10px; text-decoration: none; background: #007bff; color: white; border-radius: 3px; }
        .btn-admin { background: #28a745; }
    </style>
</head>
<body>
    <h1>Menu Administration</h1>
    <p><a href="{% url 'menu_list' %}">Back to Public Menu</a></p>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>URL</th>
                <th>Order</th>
                <th>Parent</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for item in items %}
            <tr>
                <td>{{ item.id }}</td>
                <td>{{ item.title }}</td>
                <td>{{ item.url }}</td>
                <td>{{ item.order }}</td>
                <td>{{ item.parent.title|default:"-" }}</td>
                <td>
                    <a href="{% url 'admin:pages_menuitem_change' item.id %}" class="btn btn-admin">Edit in Django Admin</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
