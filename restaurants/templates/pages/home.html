{% extends 'base.html' %}

{% block title %}Welcome{% endblock %}

{% block content %}
<div class="text-center py-10">
    <button class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition" onclick="document.documentElement.classList.toggle('dark'); localStorage.setItem('darkMode', document.documentElement.classList.contains('dark'))">languages</button>

    <h1 id="welcome-text" class="text-4xl font-bold text-blue-700 mb-6">Welcome to restaurants</h1>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-6 max-w-2xl mx-auto">
        {% for item in items %}
        <a href="/{{ location }}/{{ item.path }}/"
            class="flex items-center justify-between px-4 py-3 bg-white text-gray-800 text-sm font-medium rounded-lg shadow hover:shadow-md hover:bg-gray-50 transition border border-gray-100">
            <svg class="w-[25px] h-[25px] text-blue-600 flex-shrink-0" fill="none" stroke="currentColor"
                viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                    d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4">
                </path>
            </svg>
            <span class="text-right">{{ item.title }}</span>
        </a>
        {% endfor %}
    </div>
    <p class="mt-4 text-blue-400">This is the main page.</p>
</div>
{% endblock %}
