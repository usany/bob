{% extends 'base.html' %}

{% block title %}{{ restaurant.title }}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto py-10">
    <a href="/{{ location }}/" class="text-blue-600 font-medium text-sm hover:underline">&larr; Back</a>
    <h1 class="text-3xl font-bold text-blue-700 mt-4 mb-6">{{ restaurant.title }}</h1>
    <ul class="grid grid-cols-1 gap-3">
        {% for item in menu_items %}
        <li>
            <a href="{{ item.url }}"
                class="block px-4 py-3 bg-white text-gray-800 text-sm font-medium rounded-lg shadow hover:shadow-md hover:bg-gray-50 transition border border-gray-100">
                {{ item.title }}
            </a>
        </li>
        {% empty %}
        <li class="text-gray-500">No menu items available.</li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
