{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}App{% endblock %}</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'styles.css' %}">
    <link rel="stylesheet" href="{% static 'nav.css' %}">
    {% block extra_css %}{% endblock %}
    <script>
        // Cookie helper functions
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }
        
        function setCookie(name, value, days = 365) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = `expires=${date.toUTCString()}`;
            document.cookie = `${name}=${value};${expires};path=/`;
        }
        
        // Restore dark mode before paint to avoid flash
        const saved = getCookie('darkMode');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'true' || (saved === null && prefersDark)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>

<body class="m-0 p-0 font-['Inter',sans-serif] bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 pb-[90px] box-border">
    <main class="p-5 max-w-3xl mx-auto">
        {% block content %}{% endblock %}
    </main>

    <nav class="bottom-nav fixed bottom-6 left-1/2 -translate-x-1/2 w-max min-w-[200px] bg-white/90 dark:bg-slate-800/90 backdrop-blur-[15px] shadow-[0_10px_30px_rgba(0,0,0,0.1),0_1px_3px_rgba(0,0,0,0.05)] dark:shadow-[0_10px_30px_rgba(0,0,0,0.4),0_1px_3px_rgba(0,0,0,0.2)] flex justify-around px-[30px] py-3 rounded-full border border-white/80 dark:border-white/10 z-[1000] flex-col">
        <!-- Top Buttons Wrapper (Dark Mode + Language) -->
        <div class="top-buttons-row hidden flex-col gap-5 justify-center">
            <button class="nav-item flex flex-col items-center no-underline text-slate-400 dark:text-slate-500 text-xs font-medium hover:text-blue-500 dark:hover:text-blue-400 hover:-translate-y-0.5 transition-all duration-300 bg-transparent border-none cursor-pointer" onclick="document.querySelector('.bottom-nav').classList.toggle('expanded')">
                <svg class="w-6 h-6 mb-1 fill-current" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M7 10l5 5 5-5z" />
                </svg>
            </button>
            <div class="nav-items-row flex flex-col gap-[30px] justify-around">
                <!-- Language Button (hidden by default, shown when expanded) -->
                <button class="cursor-pointer text-xl bg-transparent border-none text-slate-400 dark:text-slate-500 hover:text-blue-500 dark:hover:text-blue-400 transition-colors duration-300 p-0" id="language-toggle" onclick="alert('Language selector')">
                    <span id="language-icon">campus</span>
                </button>
                <!-- Language Button (hidden by default, shown when expanded) -->
                <button class="cursor-pointer text-xl bg-transparent border-none text-slate-400 dark:text-slate-500 hover:text-blue-500 dark:hover:text-blue-400 transition-colors duration-300 p-0" id="language-toggle" onclick="alert('Language selector')">
                    <span id="language-icon">🌐 language</span>
                </button>
                <!-- Dark Mode Toggle (hidden by default, shown when expanded) -->
                <button class="cursor-pointer text-xl bg-transparent border-none text-slate-400 dark:text-slate-500 hover:text-blue-500 dark:hover:text-blue-400 transition-colors duration-300 p-0" id="dark-mode-toggle" onclick="document.documentElement.classList.toggle('dark'); setCookie('darkMode', document.documentElement.classList.contains('dark'))">
                    <span id="theme-icon">🌙 theme</span>
                </button>
    
            </div>
        </div>
        <button class="nav-item flex flex-col items-center no-underline text-slate-400 dark:text-slate-500 text-xs font-medium hover:text-blue-500 dark:hover:text-blue-400 hover:-translate-y-0.5 transition-all duration-300 bg-transparent border-none cursor-pointer" id="nav-toggle" onclick="document.querySelector('.bottom-nav').classList.toggle('expanded')">
            <svg class="w-6 h-6 mb-1 fill-current" viewBox="0 0 24 24" fill="currentColor">
                <path d="M7 14l5-5 5 5z" />
            </svg>
        </button>
        <!-- Nav Items Wrapper -->
        <div class="nav-items-row flex flex-row gap-[30px] justify-around">
            <!-- Location 1: Home Link -->
            <a href="{% url 'home' %}" class="nav-item flex flex-col items-center no-underline text-slate-400 dark:text-slate-500 text-xs font-medium hover:text-blue-500 dark:hover:text-blue-400 hover:-translate-y-0.5 transition-all duration-300" id="nav-home">
                <svg class="w-6 h-6 mb-1 fill-current" viewBox="0 0 24 24">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
                </svg>
                <span>se</span>
            </a>
            <!-- Location 2: Menus Link -->
            <a href="{% url 'home_gl' %}" class="nav-item flex flex-col items-center no-underline text-slate-400 dark:text-slate-500 text-xs font-medium hover:text-blue-500 dark:hover:text-blue-400 hover:-translate-y-0.5 transition-all duration-300" id="nav-menus">
                <svg class="w-6 h-6 mb-1 fill-current" viewBox="0 0 24 24">
                    <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
                </svg>
                <span>gl</span>
            </a>

            <!-- <button class="nav-item flex flex-col items-center no-underline text-slate-400 dark:text-slate-500 text-xs font-medium hover:text-blue-500 dark:hover:text-blue-400 hover:-translate-y-0.5 transition-all duration-300 bg-transparent border-none cursor-pointer" id="nav-toggle" onclick="document.querySelector('.bottom-nav').classList.toggle('expanded')">
                <svg class="w-6 h-6 mb-1 fill-current" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M7 14l5-5 5 5z" />
                </svg>
                <span>Menu</span>
            </button> -->
        </div>
    </nav>
    <script>
        // Simple script to set active state based on URL
        document.addEventListener('DOMContentLoaded', () => {
            const currentPath = window.location.pathname;
            if (currentPath === '/' || currentPath.startsWith('/se')) {
                document.getElementById('nav-home').style.color = '#3b82f6';
            } else if (currentPath.startsWith('/gl')) {
                document.getElementById('nav-menus').style.color = '#3b82f6';
            }

            // Update theme icon on load
            const themeIcon = document.getElementById('theme-icon');
            if (document.documentElement.classList.contains('dark')) {
                themeIcon.textContent = '☀️ theme';
            }

            // Update theme icon when toggled
            document.getElementById('dark-mode-toggle').addEventListener('click', () => {
                setTimeout(() => {
                    themeIcon.textContent = document.documentElement.classList.contains('dark') ? '☀️ theme' : '🌙 theme';
                }, 0);
            });
        });
    </script>
</body>

</html>
