{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}App{% endblock %}</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'styles.css' %}">
    <style>
        :root {
            --bg-color: #f8fafc;
            --text-color: #1e293b;
        }

        html.dark {
            --bg-color: #0f172a;
            --text-color: #e2e8f0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 90px;
            box-sizing: border-box;
        }

        main {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 1rem;
            text-align: center;
        }

        /* Custom expanded state for nav */
        nav.expanded {
            flex-direction: column;
            gap: 1rem;
            padding-top: 1.25rem;
            padding-bottom: 1.25rem;
        }

        nav.expanded .top-buttons-row {
            display: flex;
        }
    </style>
    {% block extra_css %}{% endblock %}
    <script>
        // Restore dark mode before paint to avoid flash
        const saved = localStorage.getItem('darkMode');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'true' || (saved === null && prefersDark)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>

<body>
    <main>
        {% block content %}{% endblock %}
    </main>

    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-max bg-white/90 dark:bg-slate-900/90 backdrop-blur-2xl rounded-full border border-white/80 dark:border-white/10 shadow-lg z-1000 flex flex-col gap-4 px-8 py-3 dark:shadow-2xl transition-all duration-300">
        <!-- Top Buttons Wrapper (Dark Mode + Language) -->
        <div class="hidden expanded:flex flex-row gap-5 justify-center">
            <!-- Dark Mode Toggle -->
            <button class="dark-mode-btn cursor-pointer text-xl bg-none border-none text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors p-0" id="dark-mode-toggle" onclick="document.documentElement.classList.toggle('dark'); localStorage.setItem('darkMode', document.documentElement.classList.contains('dark'))">
                <span id="theme-icon">🌙</span>
            </button>

            <!-- Language Button -->
            <button class="language-btn cursor-pointer text-xl bg-none border-none text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors p-0" id="language-toggle" onclick="alert('Language selector')">
                <span id="language-icon">🌐</span>
            </button>
        </div>

        <!-- Nav Items Wrapper -->
        <div class="flex flex-row gap-8 justify-around">
            <!-- Location 1: Home Link -->
            <a href="{% url 'home' %}" class="nav-item" id="nav-home">
                <svg class="nav-icon" viewBox="0 0 24 24">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
                </svg>
                <span>se</span>
            </a>
            <!-- Location 2: Menus Link -->
            <a href="{% url 'home_gl' %}" class="nav-item" id="nav-menus">
                <svg class="nav-icon" viewBox="0 0 24 24">
                    <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
                </svg>
                <span>gl</span>
            </a>

            <!-- Toggle Button (on the right) -->
            <button class="nav-item toggle-btn" id="nav-toggle" onclick="document.querySelector('.bottom-nav').classList.toggle('expanded')">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
                </svg>
                <span>Menu</span>
            </button>
        </div>
    </nav>
    <script>
        // Simple script to set active state based on URL
        document.addEventListener('DOMContentLoaded', () => {
            const currentPath = window.location.pathname;
            if (currentPath === '/' || currentPath.startsWith('/se')) {
                document.getElementById('nav-home').style.color = 'var(--nav-active)';
            } else if (currentPath.startsWith('/gl')) {
                document.getElementById('nav-menus').style.color = 'var(--nav-active)';
            }

            // Update theme icon on load
            const themeIcon = document.getElementById('theme-icon');
            if (document.documentElement.classList.contains('dark')) {
                themeIcon.textContent = '☀️';
            }

            // Update theme icon when toggled
            document.getElementById('dark-mode-toggle').addEventListener('click', () => {
                setTimeout(() => {
                    themeIcon.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
                }, 0);
            });
        });
    </script>
</body>

</html>
