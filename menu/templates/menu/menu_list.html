<!DOCTYPE html>
<html>
<head>
    <title>Menu List</title>
</head>
<body>
    <h1>Menu Items</h1>
    <ul>
        {% for item in menu_items %}
            <li>
                <a href="{{ item.url }}">{{ item.title }}</a>
                {% if item.children.exists %}
                    <ul>
                        {% for child in item.children.all %}
                            <li><a href="{{ child.url }}">{{ child.title }}</a></li>
                        {% endfor %}
                    </ul>
                {% endif %}
            </li>
        {% empty %}
            <li>No menu items available.</li>
        {% endfor %}
    </ul>
</body>
</html>
